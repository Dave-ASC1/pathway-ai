<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 820" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arrowcyan" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0891b2"/>
    </marker>
    <marker id="arrowpurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="820" fill="#ffffff"/>

  <!-- title -->
  <text x="520" y="46" text-anchor="middle" font-size="28" font-weight="bold" fill="#041336">ENHANCED PHASE (After Enhancements)</text>
  <text x="520" y="74" text-anchor="middle" font-size="15" fill="#64748b">Pathway AI — Claude Opus 4.8 powering all four modules with data handoff and file upload</text>

  <!-- ===== TIER 1: Navigation / functional (blue) ===== -->
  <rect x="90" y="110" width="200" height="72" rx="12" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  <text x="190" y="142" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">Landing Page</text>
  <text x="190" y="163" text-anchor="middle" font-size="11" fill="#e0ecff">Hero, module cards</text>

  <rect x="420" y="110" width="200" height="72" rx="12" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  <text x="520" y="142" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">Dashboard</text>
  <text x="520" y="163" text-anchor="middle" font-size="11" fill="#e0ecff">Workspace + history</text>

  <rect x="750" y="110" width="200" height="72" rx="12" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  <text x="850" y="142" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">Saved Results</text>
  <text x="850" y="163" text-anchor="middle" font-size="11" fill="#e0ecff">Persisted analyses</text>

  <line x1="290" y1="146" x2="414" y2="146" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="620" y1="146" x2="744" y2="146" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- connector from dashboard down to modules -->
  <line x1="520" y1="182" x2="520" y2="212" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="520" y="205" text-anchor="middle" font-size="11" fill="#64748b"> </text>

  <!-- ===== TIER 2: Claude AI modules (cyan) ===== -->
  <text x="520" y="240" text-anchor="middle" font-size="15" font-weight="bold" fill="#0e7490">Claude Opus 4.8 AI-Powered Modules</text>

  <!-- module boxes -->
  <rect x="60" y="258" width="210" height="96" rx="12" fill="#22d3ee" stroke="#0891b2" stroke-width="2"/>
  <text x="165" y="292" text-anchor="middle" font-size="16" font-weight="bold" fill="#083344">Resume Checker</text>
  <text x="165" y="314" text-anchor="middle" font-size="11" fill="#0e5163">AI ATS scoring +</text>
  <text x="165" y="330" text-anchor="middle" font-size="11" fill="#0e5163">file upload (PDF/DOCX)</text>

  <rect x="300" y="258" width="210" height="96" rx="12" fill="#22d3ee" stroke="#0891b2" stroke-width="2"/>
  <text x="405" y="292" text-anchor="middle" font-size="16" font-weight="bold" fill="#083344">Career Path</text>
  <text x="405" y="314" text-anchor="middle" font-size="11" fill="#0e5163">3 AI career paths +</text>
  <text x="405" y="330" text-anchor="middle" font-size="11" fill="#0e5163">progression + skills</text>

  <rect x="540" y="258" width="210" height="96" rx="12" fill="#22d3ee" stroke="#0891b2" stroke-width="2"/>
  <text x="645" y="292" text-anchor="middle" font-size="16" font-weight="bold" fill="#083344">Skill Gap</text>
  <text x="645" y="314" text-anchor="middle" font-size="11" fill="#0e5163">AI gap analysis +</text>
  <text x="645" y="330" text-anchor="middle" font-size="11" fill="#0e5163">learning roadmap</text>

  <rect x="780" y="258" width="210" height="96" rx="12" fill="#22d3ee" stroke="#0891b2" stroke-width="2"/>
  <text x="885" y="292" text-anchor="middle" font-size="16" font-weight="bold" fill="#083344">Interview Coach</text>
  <text x="885" y="314" text-anchor="middle" font-size="11" fill="#0e5163">AI questions +</text>
  <text x="885" y="330" text-anchor="middle" font-size="11" fill="#0e5163">response scoring</text>

  <!-- data handoff arrows between modules (cyan, bidirectional feel) -->
  <line x1="270" y1="378" x2="300" y2="378" stroke="#0891b2" stroke-width="2" marker-end="url(#arrowcyan)"/>
  <line x1="510" y1="378" x2="540" y2="378" stroke="#0891b2" stroke-width="2" marker-end="url(#arrowcyan)"/>
  <line x1="750" y1="378" x2="780" y2="378" stroke="#0891b2" stroke-width="2" marker-end="url(#arrowcyan)"/>
  <!-- handoff underline path connecting all four -->
  <path d="M165,354 L165,378 L885,378 L885,354" fill="none" stroke="#0891b2" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="520" y="398" text-anchor="middle" font-size="11" font-style="italic" fill="#0e7490">Data handoff: resume text and skills shared across modules</text>

  <!-- connectors from each module down to API layer -->
  <line x1="165" y1="410" x2="165" y2="470" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowpurple)"/>
  <line x1="405" y1="410" x2="405" y2="470" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowpurple)"/>
  <line x1="645" y1="410" x2="645" y2="470" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowpurple)"/>
  <line x1="885" y1="410" x2="885" y2="470" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowpurple)"/>

  <!-- ===== TIER 3: API routes layer (purple) ===== -->
  <rect x="60" y="474" width="930" height="150" rx="14" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="520" y="502" text-anchor="middle" font-size="15" font-weight="bold" fill="#5b21b6">Backend API Routes Layer (server-side, rate limited)</text>

  <!-- 5 API route pills -->
  <rect x="88" y="520" width="168" height="80" rx="10" fill="#7c3aed" stroke="#5b21b6" stroke-width="2"/>
  <text x="172" y="550" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">/api/analyze-resume</text>
  <text x="172" y="572" text-anchor="middle" font-size="10" fill="#ede9fe">Claude call + fallback</text>

  <rect x="272" y="520" width="168" height="80" rx="10" fill="#7c3aed" stroke="#5b21b6" stroke-width="2"/>
  <text x="356" y="550" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">/api/career-path</text>
  <text x="356" y="572" text-anchor="middle" font-size="10" fill="#ede9fe">Path generation</text>

  <rect x="456" y="520" width="168" height="80" rx="10" fill="#7c3aed" stroke="#5b21b6" stroke-width="2"/>
  <text x="540" y="550" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">/api/skill-gap</text>
  <text x="540" y="572" text-anchor="middle" font-size="10" fill="#ede9fe">Roadmap builder</text>

  <rect x="640" y="520" width="168" height="80" rx="10" fill="#7c3aed" stroke="#5b21b6" stroke-width="2"/>
  <text x="724" y="550" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">/api/interview</text>
  <text x="724" y="572" text-anchor="middle" font-size="10" fill="#ede9fe">Q&amp;A + scoring</text>

  <rect x="824" y="520" width="138" height="80" rx="10" fill="#7c3aed" stroke="#5b21b6" stroke-width="2"/>
  <text x="893" y="550" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">/api/upload</text>
  <text x="893" y="572" text-anchor="middle" font-size="10" fill="#ede9fe">File parsing</text>

  <!-- Claude API external -->
  <line x1="520" y1="624" x2="520" y2="660" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrowpurple)"/>
  <rect x="360" y="664" width="320" height="60" rx="12" fill="#0e7490" stroke="#083344" stroke-width="2"/>
  <text x="520" y="690" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Claude Opus 4.8 API</text>
  <text x="520" y="710" text-anchor="middle" font-size="11" fill="#cffafe">Rate limiting + local deterministic fallback</text>

  <!-- legend -->
  <rect x="60" y="748" width="930" height="56" rx="10" fill="#f7f9fc" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="88" y="766" width="20" height="20" rx="4" fill="#3b82f6"/>
  <text x="116" y="781" font-size="13" fill="#0f172a">Functional</text>

  <rect x="240" y="766" width="20" height="20" rx="4" fill="#22d3ee"/>
  <text x="268" y="781" font-size="13" fill="#0f172a">Claude AI module</text>

  <rect x="440" y="766" width="20" height="20" rx="4" fill="#7c3aed"/>
  <text x="468" y="781" font-size="13" fill="#0f172a">Backend API route</text>

  <line x1="640" y1="776" x2="680" y2="776" stroke="#0891b2" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="688" y="781" font-size="13" fill="#0f172a">Data handoff between modules</text>
</svg>
