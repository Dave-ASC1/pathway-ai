<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>

  <!-- title -->
  <text x="500" y="46" text-anchor="middle" font-size="28" font-weight="bold" fill="#041336">SIMPLE PHASE (Before Enhancements)</text>
  <text x="500" y="74" text-anchor="middle" font-size="15" fill="#64748b">Pathway AI — Keyword-matching resume checker with three non-functional module stubs</text>

  <!-- main functional flow row -->
  <!-- Landing Page (blue functional) -->
  <rect x="60" y="140" width="220" height="90" rx="12" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  <text x="170" y="180" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">Landing Page</text>
  <text x="170" y="204" text-anchor="middle" font-size="12" fill="#e0ecff">Hero, module cards, branding</text>

  <!-- Resume Checker (red local/limited) -->
  <rect x="390" y="140" width="220" height="90" rx="12" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
  <text x="500" y="176" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">Resume Checker</text>
  <text x="500" y="198" text-anchor="middle" font-size="12" fill="#ffe4e4">Client-side keyword matching</text>
  <text x="500" y="216" text-anchor="middle" font-size="12" fill="#ffe4e4">(deterministic, no AI)</text>

  <!-- Dashboard (blue functional) -->
  <rect x="720" y="140" width="220" height="90" rx="12" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  <text x="830" y="180" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">Dashboard</text>
  <text x="830" y="204" text-anchor="middle" font-size="12" fill="#e0ecff">Readiness cards, module links</text>

  <!-- arrows main flow -->
  <line x1="280" y1="185" x2="384" y2="185" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="610" y1="185" x2="714" y2="185" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- placeholder section label -->
  <text x="500" y="320" text-anchor="middle" font-size="16" font-weight="bold" fill="#64748b">Placeholder Modules (non-functional stubs)</text>
  <line x1="120" y1="336" x2="880" y2="336" stroke="#e2e8f0" stroke-width="2"/>

  <!-- link from dashboard down to placeholders -->
  <line x1="830" y1="230" x2="830" y2="300" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="830" y1="300" x2="220" y2="300" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- 3 gray placeholders -->
  <rect x="120" y="380" width="220" height="90" rx="12" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="230" y="418" text-anchor="middle" font-size="16" font-weight="bold" fill="#475569">Career Path Explorer</text>
  <text x="230" y="442" text-anchor="middle" font-size="12" fill="#64748b">Placeholder card only</text>

  <rect x="390" y="380" width="220" height="90" rx="12" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="500" y="418" text-anchor="middle" font-size="16" font-weight="bold" fill="#475569">Skill Gap Roadmap</text>
  <text x="500" y="442" text-anchor="middle" font-size="12" fill="#64748b">Placeholder card only</text>

  <rect x="660" y="380" width="220" height="90" rx="12" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="770" y="418" text-anchor="middle" font-size="16" font-weight="bold" fill="#475569">Mock Interview Coach</text>
  <text x="770" y="442" text-anchor="middle" font-size="12" fill="#64748b">Placeholder card only</text>

  <!-- dashed vertical stubs down to each placeholder -->
  <line x1="230" y1="300" x2="230" y2="376" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <line x1="500" y1="300" x2="500" y2="376" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <line x1="770" y1="300" x2="770" y2="376" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>

  <!-- legend -->
  <rect x="60" y="540" width="880" height="70" rx="10" fill="#f7f9fc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="90" y="566" font-size="14" font-weight="bold" fill="#041336">Legend</text>

  <rect x="90" y="578" width="20" height="20" rx="4" fill="#3b82f6"/>
  <text x="118" y="593" font-size="13" fill="#0f172a">Functional (working)</text>

  <rect x="300" y="578" width="20" height="20" rx="4" fill="#dc2626"/>
  <text x="328" y="593" font-size="13" fill="#0f172a">Local / Limited (no AI)</text>

  <rect x="540" y="578" width="20" height="20" rx="4" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="568" y="593" font-size="13" fill="#0f172a">Placeholder (non-functional)</text>
</svg>
